services:

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ./apps/api-go
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis

  ai-service:
    build: ./apps/ai-service
    ports:
      - "8000:8000"
    depends_on:
      - redis

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lingdiary
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql-data: